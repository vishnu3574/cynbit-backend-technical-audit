
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cynbit | Contact Us</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f6fb;
            color: #172033;
            min-height: 100vh;
        }

        header {
            background: #101b35;
            color: white;
            padding: 22px 8%;
            font-size: 23px;
            font-weight: bold;
        }

        header span {
            color: #62a5ff;
        }

        .container {
            max-width: 680px;
            margin: 55px auto;
            padding: 20px;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.07);
        }

        h1 {
            font-size: 29px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #667085;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-weight: 600;
            margin: 17px 0 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dbe5;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #2778e8;
        }

        textarea {
            min-height: 125px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 23px;
            background: #1769d2;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1054ae;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            margin-top: 18px;
            padding: 12px;
            border-radius: 7px;
            display: none;
            line-height: 1.5;
        }

        .success {
            display: block !important;
            color: #166534;
            background: #dcfce7;
        }

        .error {
            display: block !important;
            color: #991b1b;
            background: #fee2e2;
        }

        footer {
            text-align: center;
            color: #7b8495;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
            }

            .form-card {
                padding: 23px;
            }
        }
    </style>
</head>

<body>

<header>Cynbit<span>.</span></header>

<main class="container">
    <section class="form-card">

        <h1>Get in Touch</h1>

        <p class="subtitle">
            Have a question or want to discuss a project?
            Send us a message.
        </p>

        <form id="contactForm">

            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName"
                   maxlength="120" required>

            <label for="email">Email Address *</label>
            <input type="email" id="email"
                   maxlength="254" required>

            <label for="company">Company</label>
            <input type="text" id="company"
                   maxlength="120">

            <label for="industry">Industry</label>
            <select id="industry">
                <option value="">Select Industry</option>
                <option value="Technology">Technology</option>
                <option value="Education">Education</option>
                <option value="Healthcare">Healthcare</option>
                <option value="Finance">Finance</option>
                <option value="Other">Other</option>
            </select>

            <label for="message">Message *</label>
            <textarea id="message"
                      maxlength="2000"
                      required></textarea>

            <button type="submit" id="submitBtn">
                Send Message
            </button>

            <div id="status" role="status"
                 aria-live="polite"></div>

        </form>
    </section>
</main>

<footer>© 2026 Cynbit. Backend Audit Reference Demo.</footer>

<script>
    const form = document.getElementById("contactForm");
    const statusBox = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        statusBox.className = "";
        statusBox.style.display = "none";

        const requestData = {
            fullName: document.getElementById("fullName").value.trim(),
            email: document.getElementById("email").value.trim(),
            company: document.getElementById("company").value.trim(),
            industry: document.getElementById("industry").value,
            message: document.getElementById("message").value.trim()
        };

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending...";

        try {
            const response = await fetch("/api/v1/inquiries", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(requestData)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(
                    result.detail || result.message ||
                    "Please check your input and try again."
                );
            }

            statusBox.textContent =
                result.message || "Your inquiry was submitted successfully.";

            statusBox.className = "success";
            form.reset();

        } catch (error) {
            statusBox.textContent =
                error.message || "Unable to connect to the server.";

            statusBox.className = "error";

        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Send Message";
        }
    });
</script>

</body>
</html>
